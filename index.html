<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Prestige AUTO | Dashboard Luxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ffcc00; --bg: #050505; --card: #121212; --text: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        
        /* Navigation */
        nav { padding: 25px 50px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); position: fixed; width: 100%; z-index: 100; box-sizing: border-box; }
        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -1px; }
        .logo span { color: var(--accent); }

        /* Hero Page d'accueil */
        header { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); }
        header h1 { font-size: 5rem; margin: 0; line-height: 0.9; text-transform: uppercase; }
        header p { color: #888; font-size: 1.2rem; margin-top: 20px; max-width: 500px; }
        .scroll-btn { margin-top: 40px; padding: 15px 40px; background: var(--accent); color: black; font-weight: bold; border-radius: 50px; text-decoration: none; text-transform: uppercase; transition: 0.3s; }

        /* Dashboard Section */
        .container { padding: 120px 50px; max-width: 1400px; margin: auto; }
        .grid-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 40px; }
        
        /* Cartes & Style */
        .glass-card { background: var(--card); border: 1px solid #222; padding: 30px; border-radius: 20px; }
        h2 { font-size: 1.8rem; margin-bottom: 25px; border-left: 4px solid var(--accent); padding-left: 15px; }
        
        input, select, button { width: 100%; padding: 15px; margin-top: 10px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: white; font-size: 1rem; }
        button.primary { background: var(--accent); color: black; font-weight: 700; border: none; cursor: pointer; margin-top: 25px; }
        button.danger { background: transparent; color: #ff4444; border: 1px solid #ff4444; cursor: pointer; padding: 8px; font-size: 0.8rem; }

        /* Stats */
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-item { background: linear-gradient(145deg, #121212, #0a0a0a); padding: 25px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .stat-item span { display: block; color: #888; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px; }
        .stat-item b { font-size: 2rem; color: var(--accent); }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: #555; padding-bottom: 15px; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 15px 0; border-top: 1px solid #222; }
    </style>
</head>
<body>

<nav>
    <div class="logo">PRESTIGE <span>AUTO</span></div>
    <div style="display:flex; gap: 20px;">
        <a href="#admin" style="color:white; text-decoration:none; font-size: 0.9rem;">DASHBOARD</a>
    </div>
</nav>

<header>
    <h1>The Next<br><span>Level</span></h1>
    <p>Système de gestion exclusif pour les conseillers Prestige AUTO. Suivez vos performances en temps réel.</p>
    <a href="#dashboard" class="scroll-btn">Accéder aux ventes</a>
</header>

<div class="container" id="dashboard">
    <div class="stats-bar">
        <div class="stat-item"><span>Bénéfice Total</span><b id="totalBenef">0 €</b></div>
        <div class="stat-item"><span>Top Vendeur</span><b id="topVendeur">---</b></div>
        <div class="stat-item"><span>Unités Vendues</span><b id="countVentes">0</b></div>
    </div>

    <div class="grid-layout">
        <!-- FORMULAIRE -->
        <div class="glass-card">
            <h2>Nouvelle Vente</h2>
            <label>Conseiller</label>
            <input type="text" id="vendeurNom" placeholder="Nom du vendeur">
            
            <label style="display:block; margin-top:20px;">Véhicule</label>
            <select id="vehiculeSelect"></select>
            
            <button class="primary" onclick="ajouterVente()">Enregistrer la transaction</button>
        </div>

        <!-- LISTE ET SUPPRESSION -->
        <div class="glass-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Historique</h2>
                <button onclick="clearAll()" style="width:auto; background:none; border:none; color:#555; cursor:pointer;">Réinitialiser tout</button>
            </div>
            <table id="tableVentes">
                <thead>
                    <tr>
                        <th>Vendeur</th>
                        <th>Modèle</th>
                        <th>Marge</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
// Catalogue Prestige AUTO
const catalogue = {
    "Premier Limo": 100000, "Stellar 911 RS": 60000, "V Model S": 50000, "Charger 1870": 35000,
    "Stellar Coupe": 25000, "RX7": 20000, "Delorean CMD-12": 17000, "Korn Ranger 2021": 15000,
    "FTR": 15000, "Range River": 12000, "Camion Fourgon": 12000, "5008": 10000,
    "Renaud Master": 7000, "Megane IV": 6000, "Leaf Golster 1981": 5000, "Berlingo": 4000,
    "C4 Picasso": 4000, "206": 4000, "Olympia S7": 3000, "Renaud Express": 2500, "Premier": 2000
};

let ventes = JSON.parse(localStorage.getItem('prestige_v3')) || [];

function init() {
    const select = document.getElementById('vehiculeSelect');
    Object.keys(catalogue).forEach(v => {
        let opt = document.createElement('option');
        opt.value = v;
        opt.textContent = `${v} (${catalogue[v].toLocaleString()} €)`;
        select.appendChild(opt);
    });
    render();
}

function ajouterVente() {
    const nom = document.getElementById('vendeurNom').value;
    const v = document.getElementById('vehiculeSelect').value;
    if(!nom) return alert("Nom requis");
    ventes.push({ id: Date.now(), nom, vehicule: v, prix: catalogue[v] });
    save();
}

function supprimer(id) {
    ventes = ventes.filter(v => v.id !== id);
    save();
}

function clearAll() {
    if(confirm("Effacer tout l'historique ?")) { ventes = []; save(); }
}

function save() {
    localStorage.setItem('prestige_v3', JSON.stringify(ventes));
    render();
}

function render() {
    const body = document.querySelector('#tableVentes tbody');
    body.innerHTML = "";
    let total = 0;
    let profils = {};

    ventes.forEach(v => {
        total += v.prix;
        profils[v.nom] = (profils[v.nom] || 0) + v.prix;
        body.innerHTML += `<tr>
            <td>${v.nom}</td>
            <td>${v.vehicule}</td>
            <td style="color:var(--accent)">${v.prix.toLocaleString()} €</td>
            <td><button class="danger" onclick="supprimer(${v.id})">Supprimer</button></td>
        </tr>`;
    });

    document.getElementById('totalBenef').innerText = total.toLocaleString() + " €";
    document.getElementById('countVentes').innerText = ventes.length;
    
    let top = Object.keys(profils).reduce((a, b) => profils[a] > profils[b] ? a : b, "---");
    document.getElementById('topVendeur').innerText = top;
}

init();
</script>
</body>
</html>

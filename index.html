<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PRESTIGE AUTO | OS V4</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-gold: #ffcc00;
            --deep-black: #080808;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 204, 0, 0.2);
        }

        body {
            background-color: var(--deep-black);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -20%, #1a1a00 0%, var(--deep-black) 80%);
        }

        /* --- ACCUEIL IMMERSIF --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
        }

        .glitch-title {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            line-height: 0.8;
            letter-spacing: -5px;
            text-transform: uppercase;
            margin: 0;
        }

        .glitch-title span { color: var(--neon-gold); display: block; }

        /* --- DASHBOARD FUTURISTE --- */
        .main-app { padding: 50px 5%; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }

        .panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 0 40px 0 40px;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-gold), transparent);
        }

        /* Stats flottantes */
        .stat-card { text-align: center; margin-bottom: 25px; }
        .stat-label { font-family: 'Syncopate'; font-size: 0.7rem; color: var(--neon-gold); opacity: 0.7; }
        .stat-value { font-size: 2.5rem; font-weight: 600; display: block; }

        /* Inputs Style */
        input, select {
            width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--border);
            color: white; padding: 15px 0; font-size: 1.1rem; margin-top: 20px; outline: none; transition: 0.3s;
        }

        input:focus { border-color: var(--neon-gold); }

        .btn-action {
            width: 100%; padding: 20px; margin-top: 40px; border-radius: 50px; border: 1px solid var(--neon-gold);
            background: transparent; color: var(--neon-gold); font-family: 'Syncopate'; font-weight: bold;
            cursor: pointer; transition: 0.4s; text-transform: uppercase;
        }

        .btn-action:hover { background: var(--neon-gold); color: black; box-shadow: 0 0 30px rgba(255, 204, 0, 0.4); }

        /* Tableau Pro */
        .sales-list { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        .sales-list tr { background: rgba(255,255,255,0.02); transition: 0.3s; }
        .sales-list tr:hover { background: rgba(255,255,255,0.05); }
        .sales-list td { padding: 20px; }
        .sales-list td:first-child { border-radius: 15px 0 0 15px; font-weight: bold; }
        .sales-list td:last-child { border-radius: 0 15px 15px 0; text-align: right; }

        .delete-icon { color: #ff4444; cursor: pointer; border: 1px solid #ff4444; padding: 5px 10px; border-radius: 5px; background: none; }
    </style>
</head>
<body>

<section class="hero">
    <h1 class="glitch-title">Prestige<span>Auto.</span></h1>
    <p style="font-size: 1.5rem; opacity: 0.5;">L'empire de l'automobile commence ici.</p>
</section>

<div class="main-app">
    <!-- BARRE LATERALE -->
    <aside>
        <div class="panel">
            <div class="stat-card">
                <span class="stat-label">Bénéfice global</span>
                <span class="stat-value" id="v_total">0 €</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Top Performance</span>
                <span class="stat-value" id="v_top" style="font-size: 1.5rem;">---</span>
            </div>
            <hr style="opacity: 0.1; margin: 30px 0;">
            <h3 style="font-family: 'Syncopate'; font-size: 0.8rem;">Enregistrement</h3>
            <input type="text" id="in_nom" placeholder="IDENTIFIANT VENDEUR">
            <select id="in_vehicule"></select>
            <button class="btn-action" onclick="pushVente()">Valider</button>
        </div>
    </aside>

    <!-- LISTE DES VENTES -->
    <main class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-family: 'Syncopate';">Archives Transactions</h2>
            <button onclick="clearData()" style="background:none; border:none; color:rgba(255,255,255,0.3); cursor:pointer;">PURGER SYSTÈME</button>
        </div>
        <table class="sales-list" id="log_ventes">
            <thead>
                <tr style="background: transparent; color: var(--neon-gold); font-size: 0.7rem; text-transform: uppercase;">
                    <th>Vendeur</th>
                    <th>Modèle</th>
                    <th>Bénéfice</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>
</div>

<script>
// Intégration du catalogue complet de Prestige AUTO
const catalogue = {
    "Premier Limo": 100000, "Stellar 911 RS": 60000, "V Model S": 50000, "Charger 1870": 35000,
    "Stellar Coupe": 25000, "RX7": 20000, "Delorean CMD-12": 17000, "Korn Ranger 2021": 15000,
    "FTR": 15000, "Range River": 12000, "Camion Fourgon": 12000, "5008": 10000,
    "Renaud Master": 7000, "Megane IV": 6000, "Leaf Golster 1981": 5000, "Berlingo": 4000,
    "C4 Picasso": 4000, "206": 4000, "Olympia S7": 3000, "Renaud Express": 2500, "Premier": 2000
};

let data = JSON.parse(localStorage.getItem('prestige_os_v4')) || [];

function setup() {
    const s = document.getElementById('in_vehicule');
    Object.keys(catalogue).forEach(k => {
        let o = document.createElement('option');
        o.value = k;
        o.textContent = `${k.toUpperCase()} — ${catalogue[k].toLocaleString()} €`;
        s.appendChild(o);
    });
    refresh();
}

function pushVente() {
    const n = document.getElementById('in_nom').value;
    const v = document.getElementById('in_vehicule').value;
    if(!n) return alert("Identifiant requis.");
    data.push({ id: Date.now(), nom: n, car: v, money: catalogue[v] });
    sync();
}

function dropVente(id) {
    data = data.filter(x => x.id !== id);
    sync();
}

function clearData() {
    if(confirm("Confirmer la purge totale des données ?")) { data = []; sync(); }
}

function sync() {
    localStorage.setItem('prestige_os_v4', JSON.stringify(data));
    refresh();
}

function refresh() {
    const table = document.querySelector('#log_ventes tbody');
    table.innerHTML = "";
    let total = 0;
    let leader = {};

    data.forEach(d => {
        total += d.money;
        leader[d.nom] = (leader[d.nom] || 0) + d.money;
        table.innerHTML += `<tr>
            <td>${d.nom}</td>
            <td style="opacity:0.6">${d.car}</td>
            <td style="color:var(--neon-gold)">+${d.money.toLocaleString()} €</td>
            <td><button class="delete-icon" onclick="dropVente(${d.id})">×</button></td>
        </tr>`;
    });

    document.getElementById('v_total').innerText = total.toLocaleString() + " €";
    
    let topName = Object.keys(leader).reduce((a, b) => leader[a] > leader[b] ? a : b, "---");
    document.getElementById('v_top').innerText = topName.toUpperCase();
}

setup();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Prestige AUTO | Titanium OS V6</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00d4ff; --dark: #0a0b10; --card: #15171f; --pdg: #ff0055; }
        body { font-family: 'Montserrat', sans-serif; background: var(--dark); color: #fff; margin: 0; scroll-behavior: smooth; }
        
        /* ACCUEIL */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #1e2230 0%, var(--dark) 100%); }
        .hero h1 { font-family: 'Bebas Neue', cursive; font-size: 8rem; margin: 0; letter-spacing: 10px; background: linear-gradient(to bottom, #fff, #444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { text-transform: uppercase; letter-spacing: 5px; opacity: 0.5; margin-top: -10px; }
        .nav-btns { margin-top: 50px; display: flex; gap: 20px; }
        .btn { padding: 15px 35px; border: 1px solid rgba(255,255,255,0.2); color: #fff; text-decoration: none; border-radius: 50px; transition: 0.3s; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; cursor: pointer;}
        .btn:hover { background: #fff; color: #000; }

        /* SECTIONS */
        .section { padding: 80px 5%; min-height: 100vh; display: none; }
        .active { display: block; }
        .title-sec { font-family: 'Bebas Neue'; font-size: 4rem; color: var(--accent); margin-bottom: 40px; }

        /* GESTION VENDEURS */
        .glass-box { background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); max-width: 600px; margin: auto; }
        input, select { width: 100%; padding: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; margin-top: 10px; margin-bottom: 20px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* STATS PDG */
        .stats-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { flex: 1; background: var(--card); padding: 20px; border-radius: 15px; text-align: center; border-bottom: 3px solid var(--pdg); }
        .stat-card small { font-size: 0.7rem; opacity: 0.5; text-transform: uppercase; }
        .stat-box-val { font-size: 1.8rem; font-weight: bold; margin-top: 5px; color: var(--pdg); }

        /* TABLEAU HISTORIQUE */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(0,0,0,0.3); border-radius: 10px; overflow: hidden;}
        th { text-align: left; padding: 15px; background: #1a1a1a; color: var(--pdg); font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 15px; border-top: 1px solid rgba(255,255,255,0.05); }

        /* LOCK SCREEN */
        .pdg-lock { height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;}
        .pdg-only-text { color: var(--pdg); font-family: 'Bebas Neue'; font-size: 5rem; line-height: 1; }
    </style>
</head>
<body>

<!-- ACCUEIL -->
<section id="home" class="hero">
    <h1>PRESTIGE AUTO</h1>
    <p>Système de Gestion Intégré</p>
    <div class="nav-btns">
        <button class="btn" onclick="showSection('vendeurs')">Espace Ventes</button>
        <button class="btn" style="border-color: var(--pdg); color: var(--pdg);" onclick="showSection('pdg-lock')">Salon PDG</button>
    </div>
</section>

<!-- SECTION VENTES (PUBLIC VENDEURS) -->
<section id="vendeurs" class="section">
    <button class="btn" onclick="showSection('home')">← Retour</button>
    <div class="title-sec" style="text-align: center;">Portail Conseiller</div>
    <div class="glass-box">
        <h3>Enregistrer une Transaction</h3>
        <label>Identifiant Vendeur</label>
        <input type="text" id="sellerName" placeholder="Entrez votre nom">
        <label>Sélection Véhicule</label>
        <select id="carSelect"></select>
        <button class="btn-submit" onclick="addSale()">Valider la vente</button>
    </div>
</section>

<!-- LOCK PDG -->
<section id="pdg-lock" class="pdg-lock">
    <div class="pdg-only-text">RESTRICTED<br>AREA</div>
    <p style="letter-spacing: 2px; opacity: 0.6;">AUTORISATION PDG REQUISE</p>
    <input type="password" id="pdgCode" placeholder="CODE PIN" style="width: 200px; text-align: center; border-color: var(--pdg); font-size: 1.5rem;">
    <div style="display: flex; gap:10px;">
        <button class="btn" onclick="showSection('home')">Annuler</button>
        <button class="btn" style="background: var(--pdg); color: #fff; border:none;" onclick="checkCode()">Accéder</button>
    </div>
</section>

<!-- SALON PDG (HISTORIQUE & ADMIN) -->
<section id="pdg-section" class="section">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <div class="title-sec" style="color: var(--pdg); margin:0;">PDG CONTROL CENTER</div>
        <button class="btn" onclick="showSection('home')">Déconnexion</button>
    </div>

    <div class="stats-container" style="margin-top: 40px;">
        <div class="stat-card"><small>Bénéfice Net Total</small><div class="stat-box-val" id="totalGains">0 €</div></div>
        <div class="stat-card"><small>Meilleur Vendeur</small><div class="stat-box-val" id="topV">---</div></div>
        <div class="stat-card"><small>Volume de Ventes</small><div class="stat-box-val" id="units">0</div></div>
    </div>

    <div style="background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--pdg);">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h3>Journal Historique des Ventes</h3>
            <button onclick="purgeAll()" style="color:var(--pdg); background:none; border: 1px solid var(--pdg); padding: 5px 15px; border-radius: 5px; cursor:pointer;">Purger tout</button>
        </div>
        <table id="salesTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Vendeur</th>
                    <th>Modèle</th>
                    <th>Marge</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</section>

<script>
// Catalogue complet Prestige AUTO
const database = {
    "Premier Limo": 100000, "Stellar 911 RS": 60000, "V Model S": 50000, "Charger 1870": 35000,
    "Stellar Coupe": 25000, "RX7": 20000, "Delorean CMD-12": 17000, "Korn Ranger 2021": 15000,
    "FTR": 15000, "Range River": 12000, "Camion Fourgon": 12000, "5008": 10000,
    "Renaud Master": 7000, "Megane IV": 6000, "Leaf Golster 1981": 5000, "Berlingo": 4000,
    "C4 Picasso": 4000, "206": 4000, "Olympia S7": 3000, "Renaud Express": 2500, "Premier": 2000
};

let sales = JSON.parse(localStorage.getItem('prestige_v6')) || [];

function setup() {
    const s = document.getElementById('carSelect');
    Object.keys(database).forEach(car => {
        let opt = document.createElement('option');
        opt.value = car;
        opt.textContent = `${car.toUpperCase()} (${database[car].toLocaleString()} €)`;
        s.appendChild(opt);
    });
    render();
}

function showSection(id) {
    document.querySelectorAll('.section, .pdg-lock, .hero').forEach(s => s.style.display = 'none');
    const target = document.getElementById(id);
    if(id === 'home') target.style.display = 'flex';
    else if(id === 'pdg-lock') target.style.display = 'flex';
    else target.style.display = 'block';
}

function addSale() {
    const name = document.getElementById('sellerName').value;
    const car = document.getElementById('carSelect').value;
    if(!name) return alert("Veuillez entrer votre nom de vendeur.");
    
    sales.push({ 
        id: Date.now(), 
        date: new Date().toLocaleDateString('fr-FR'),
        seller: name, 
        car: car, 
        profit: database[car] 
    });
    
    localStorage.setItem('prestige_v6', JSON.stringify(sales));
    alert("Vente enregistrée avec succès !");
    document.getElementById('sellerName').value = "";
    render();
}

function checkCode() {
    const code = document.getElementById('pdgCode').value;
    if(code === "2009") {
        showSection('pdg-section');
        document.getElementById('pdgCode').value = "";
    } else {
        alert("ACCÈS REFUSÉ : CODE PIN INCORRECT");
    }
}

function deleteSale(id) {
    sales = sales.filter(x => x.id !== id);
    localStorage.setItem('prestige_v6', JSON.stringify(sales));
    render();
}

function purgeAll() {
    if(confirm("ALERTE : Voulez-vous vraiment supprimer TOUT l'historique ?")) {
        sales = [];
        localStorage.setItem('prestige_v6', JSON.stringify(sales));
        render();
    }
}

function render() {
    const body = document.querySelector('#salesTable tbody');
    body.innerHTML = "";
    let total = 0;
    let leaders = {};

    sales.forEach(s => {
        total += s.profit;
        leaders[s.seller] = (leaders[s.seller] || 0) + s.profit;
        body.innerHTML += `<tr>
            <td style="opacity:0.5; font-size:0.8rem">${s.date}</td>
            <td><b>${s.seller}</b></td>
            <td>${s.car}</td>
            <td style="color:var(--pdg); font-weight:bold;">${s.profit.toLocaleString()} €</td>
            <td><button onclick="deleteSale(${s.id})" style="color:red; background:none; border:none; cursor:pointer;">Effacer</button></td>
        </tr>`;
    });

    document.getElementById('totalGains').innerText = total.toLocaleString() + " €";
    document.getElementById('units').innerText = sales.length;
    let top = Object.keys(leaders).reduce((a, b) => leaders[a] > leaders[b] ? a : b, "---");
    document.getElementById('topV').innerText = top.toUpperCase();
}

setup();
</script>
</body>
</html>
